name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            name: ubuntu-clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows-mingw
            cc: gcc
            cxx: g++
          - os: windows-latest
            name: windows-msvc
            cxx: cl
            msvc: true
          - os: windows-latest
            name: windows-clang-cl
            cxx: clang-cl
            msvc: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        if: matrix.cxx == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts cl and clang-cl on PATH. Without it, Ninja finds MinGW g++ first.
      - name: MSVC environment
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -G Ninja -DIPXX_BUILD_TESTS=ON)
          if [ -n "${{ matrix.cxx }}" ]; then
            args+=("-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}")
          fi
          if [ -n "${{ matrix.cc }}" ]; then
            args+=("-DCMAKE_C_COMPILER=${{ matrix.cc }}")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub has no FreeBSD runner. This boots a real FreeBSD VM.
      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake
          run: |
            cmake -S . -B build -DIPXX_BUILD_TESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure
